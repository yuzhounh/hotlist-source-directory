  <script>
    const data = JSON.parse(document.getElementById('directoryData').textContent);
    const state = { view: 'small', category: 0, page: 1, pageSize: 100, query: '' };
    const els = {
      tabs: [...document.querySelectorAll('[data-view]')], smallView: document.getElementById('smallView'),
      tophubView: document.getElementById('tophubView'), smallSites: document.getElementById('smallSites'),
      search: document.getElementById('searchInput'), clear: document.getElementById('clearSearch'),
      pageSizeWrap: document.getElementById('pageSizeWrap'), pageSize: document.getElementById('pageSize'),
      smallCount: document.getElementById('smallResultCount'), categoryTabs: document.getElementById('categoryTabs'),
      categoryHeading: document.getElementById('categoryHeading'), topCount: document.getElementById('tophubResultCount'),
      sourceGrid: document.getElementById('sourceGrid'), pagination: document.getElementById('pagination'),
      theme: document.getElementById('themeToggle')
    };

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const normalizedQuery = () => state.query.trim().toLocaleLowerCase('zh-CN');
    const matches = (value) => !normalizedQuery() || value.toLocaleLowerCase('zh-CN').includes(normalizedQuery());
    const highlight = (value) => {
      const safe = escapeHtml(value), query = state.query.trim();
      if (!query) return safe;
      const escaped = query.replace(/[.*+?^$()|[\]{}\\]/g, '\\$&');
      return safe.replace(new RegExp(escaped, 'ig'), (hit) => '<mark>' + hit + '</mark>');
    };

    function renderSmallSites() {
      let visibleTotal = 0;
      els.smallSites.innerHTML = data.smallSites.map((site, siteIndex) => {
        const groups = site.groups.length ? site.groups : [{ name: '全部来源', items: site.items }];
        const visibleGroups = groups.map((group) => ({ ...group, items: group.items.filter(matches) })).filter((group) => group.items.length);
        const visibleCount = visibleGroups.reduce((sum, group) => sum + group.items.length, 0);
        visibleTotal += visibleCount;
        if (!visibleCount) return '';
        const content = visibleGroups.map((group) => '<div class="group"><h3 class="group-label">' + escapeHtml(group.name) + ' · ' + group.items.length + '</h3><div class="tag-list">' + group.items.map((item) => '<span class="source-tag">' + highlight(item) + '</span>').join('') + '</div></div>').join('');
        return '<article class="site-card ' + (siteIndex === 0 ? 'is-newsnow' : '') + '"><header class="card-head"><a class="site-mark" href="' + escapeHtml(site.url) + '" target="_blank" rel="noreferrer" aria-label="打开 ' + escapeHtml(site.name) + '">' + escapeHtml(site.mark) + '</a><a class="card-title" href="' + escapeHtml(site.url) + '" target="_blank" rel="noreferrer"><strong>' + escapeHtml(site.name) + '</strong><small>' + escapeHtml(site.host) + '</small></a><span class="count-badge">' + visibleCount + ' / ' + site.count + '</span></header><div class="site-content">' + content + '</div></article>';
      }).join('') || '<div class="empty-state">没有找到匹配的卡片名称</div>';
      els.smallCount.textContent = state.query ? '找到 ' + visibleTotal + ' 个来源' : '122 个来源';
    }

    function renderCategoryTabs() {
      const order = data.tophubCategories.map((_, i) => i).sort((a, b) => data.tophubCategories[b].items.length - data.tophubCategories[a].items.length || a - b);
      els.categoryTabs.innerHTML = order.map((index) => { const category = data.tophubCategories[index]; return '<button type="button" class="' + (index === state.category ? 'active' : '') + '" data-category="' + index + '">' + escapeHtml(category.name) + '<small>' + category.items.length.toLocaleString('zh-CN') + '</small></button>'; }).join('');
    }

    function renderTophub() {
      const category = data.tophubCategories[state.category];
      const filtered = category.items.filter(matches);
      const pageCount = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      state.page = Math.min(state.page, pageCount);
      const start = (state.page - 1) * state.pageSize;
      const items = filtered.slice(start, start + state.pageSize);
      els.categoryHeading.innerHTML = '<a class="tophub-link" href="' + escapeHtml(category.url) + '" target="_blank" rel="noreferrer">TopHub · ' + escapeHtml(category.name) + '</a>';
      els.topCount.textContent = state.query ? '找到 ' + filtered.length.toLocaleString('zh-CN') + ' / ' + category.items.length.toLocaleString('zh-CN') + ' 个来源' : category.items.length.toLocaleString('zh-CN') + ' 个来源';
      els.sourceGrid.innerHTML = items.length ? items.map((item, index) => '<article class="source-card"><span class="source-index">' + String(start + index + 1).padStart(2, '0') + '</span><span class="source-name" title="' + escapeHtml(item) + '">' + highlight(item) + '</span></article>').join('') : '<div class="empty-state">这个分类中没有匹配的来源</div>';
      renderPagination(pageCount);
      renderCategoryTabs();
    }

    function renderPagination(pageCount) {
      if (pageCount <= 1) { els.pagination.innerHTML = ''; return; }
      const pages = [...new Set([1, state.page - 1, state.page, state.page + 1, pageCount])].filter((page) => page >= 1 && page <= pageCount).sort((a,b) => a-b);
      let last = 0;
      const pageButtons = pages.map((page) => {
        const gap = last && page - last > 1 ? '<span class="page-ellipsis" aria-hidden="true">…</span>' : '';
        last = page;
        return gap + '<button type="button" class="page-number ' + (page === state.page ? 'active' : '') + '" data-page="' + page + '" aria-label="第 ' + page + ' 页">' + page + '</button>';
      }).join('');
      els.pagination.innerHTML = '<button type="button" data-page="' + (state.page - 1) + '" ' + (state.page === 1 ? 'disabled' : '') + '>上一页</button>' + pageButtons + '<button type="button" data-page="' + (state.page + 1) + '" ' + (state.page === pageCount ? 'disabled' : '') + '>下一页</button>';
    }

    function switchView(view) {
      state.view = view; state.page = 1;
      els.tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.view === view));
      els.smallView.classList.toggle('hidden', view !== 'small');
      els.tophubView.classList.toggle('hidden', view !== 'tophub');
      els.pageSizeWrap.classList.toggle('hidden', view !== 'tophub');
      els.search.placeholder = view === 'small' ? '搜索 122 个聚合站卡片…' : '搜索当前 TopHub 分类…';
      render();
    }

    function render() { state.view === 'small' ? renderSmallSites() : renderTophub(); }
    els.tabs.forEach((tab) => tab.addEventListener('click', () => switchView(tab.dataset.view)));
    els.categoryTabs.addEventListener('click', (event) => { const button = event.target.closest('[data-category]'); if (!button) return; state.category = Number(button.dataset.category); state.page = 1; renderTophub(); document.querySelector('.view-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    els.pagination.addEventListener('click', (event) => { const button = event.target.closest('[data-page]'); if (!button || button.disabled) return; state.page = Number(button.dataset.page); renderTophub(); els.categoryHeading.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    els.search.addEventListener('input', () => { state.query = els.search.value; state.page = 1; els.clear.classList.toggle('hidden', !state.query); render(); });
    els.clear.addEventListener('click', () => { els.search.value = ''; state.query = ''; state.page = 1; els.clear.classList.add('hidden'); render(); els.search.focus(); });
    els.pageSize.addEventListener('change', () => { state.pageSize = Number(els.pageSize.value); state.page = 1; renderTophub(); });
    const sunIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>';
    const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>';
    const updateThemeIcon = () => { const dark = document.documentElement.dataset.theme === 'dark'; const label = dark ? '切换浅色模式' : '切换深色模式'; els.theme.innerHTML = dark ? sunIcon : moonIcon; els.theme.title = label; els.theme.setAttribute('aria-label', label); };
    els.theme.addEventListener('click', () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('rebanghui-theme', next); updateThemeIcon(); });
    updateThemeIcon();
    renderSmallSites();
  </script>
</body>
</html>
